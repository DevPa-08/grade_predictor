<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогнозирование успеваемости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>📊 Прогноз успеваемости</h3>
                        <p class="mb-0">Введите данные об ученике</p>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <button type="submit" class="btn btn-primary w-100">🔮 Получить прогноз</button>
                        </form>
                        
                        {% if result %}
                            <div class="mt-4 text-center p-3 rounded" style="background-color: {{ color }}20; border: 2px solid {{ color }};">
                                <h4>Прогноз итоговой оценки:</h4>
                                <h2 style="color: {{ color }}; font-weight: bold;">{{ result }}</h2>
                                <p class="mt-2">{{ message }}</p>
                            </div>
                        {% endif %}
                    </div>
                </div>
                <div class="text-center mt-3 text-muted small">
                    Прогноз основан на модели машинного обучения (XGBoost)<br>
                    Точность модели: R² = 0.87
                </div>
            </div>
        </div>
    </div>
</body>
</html>
